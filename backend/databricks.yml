bundle:
  name: certifica_att

sync:
  include:
    - app/**
    - app.yaml
    - requirements.txt
    - seed/**
    - static/**
  exclude:
    - "**/__pycache__"
    - "**/*.pyc"
    - ".env"
    - ".venv/**"

targets:
  # AT&T Certifica vive em fevm-moi-ai (Claude Opus 4.8; Lakebase em us-east-2).
  moiai:
    mode: development
    default: true
    workspace:
      host: https://fevm-moi-ai.cloud.databricks.com
      profile: fevm-moi-ai

resources:
  apps:
    certifica_att:
      name: certifica-att
      description: "AT&T Certifica — Plano de capacitação corporativa em Databricks (trilhas por área/usuário, simulados, gamificação)"
      source_code_path: .
      # OBO: scope de User authorization para o token do usuário logado poder
      # consultar serving endpoints (Claude/GPT-5). Sem isto, todo deploy reseta
      # os scopes para o default e as chamadas de LLM voltam a falhar.
      user_api_scopes:
        - serving.serving-endpoints
      resources:
        - name: jwt-secret
          secret:
            scope: certifica-att
            key: jwt_secret
            permission: READ
        - name: pg-password
          secret:
            scope: certifica-att
            key: pg_password
            permission: READ
        # Auth ao Postgres é por native login (certifica_app + senha); o app não
        # depende de um resource 'database' (acesso de rede ao Lakebase é default).
