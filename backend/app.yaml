command:
  - sh
  - -c
  - uvicorn app.main:app --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8080}

env:
  - name: MOCK_MODE
    value: "false"

  # ── Lakebase (Postgres) — PG native login (usuário + senha do secret scope) ──
  # AT&T Certifica vive em fevm-moi-ai (us-east-2). Schema DEDICADO 'certifica_att'
  # — pode coexistir na mesma instância Lakebase sem tocar em outros schemas.
  # ⚠️ Confirme o PGHOST da instância Lakebase deste workspace no deploy.
  - name: PGHOST
    value: "ep-divine-cherry-d81jnxv1.database.us-east-2.cloud.databricks.com"
  - name: PGPORT
    value: "5432"
  - name: PGDATABASE
    value: "databricks_postgres"
  - name: PGUSER
    value: "certifica_app"
  - name: PGPASSWORD
    valueFrom: pg-password
  - name: PGSSLMODE
    value: "require"
  - name: PGSCHEMA
    value: "certifica_att"

  # ── Geração via LLM (Foundation Model API) ───────────────────────────────
  # As chamadas de LLM usam OBO (token do usuário logado, via header
  # X-Forwarded-Access-Token) — não o SP do app. Por isso Claude/GPT-5 funcionam:
  # o acesso é o do usuário. Requer o scope 'serving.serving-endpoints' na
  # User authorization do app (setado via `databricks apps update`).
  - name: LLM_ENDPOINT
    value: "databricks-claude-sonnet-4-5"
  # Geração EM MASSA (simulado completo, questões IA): modelo rápido p/ caber no
  # timeout de ingress (~60s) do Databricks Apps. Deep-dive/repair usam o de cima.
  - name: LLM_ENDPOINT_FAST
    value: "databricks-claude-haiku-4-5"

  # ── Autenticação (JWT) ────────────────────────────────────────────────────
  - name: ENABLE_JWT_AUTH
    value: "true"
  # JWT_SECRET vem do secret scope (resource 'jwt-secret' em databricks.yml) — não vai no git.
  - name: JWT_SECRET
    valueFrom: jwt-secret
  - name: SUPERADMIN_EMAILS
    value: "moises.santos@databricks.com"
  - name: PASS_MARK
    value: "70"

  # Seed idempotente no primeiro boot (cria schema + banco global + tenant 'att'
  # + trilhas + grupos AT&T). Já semeado em 13-ago-2026 → desligado (o DDL segue
  # rodando em todo boot, idempotente, para novas tabelas).
  - name: SEED_ON_STARTUP
    value: "false"

  # Sincroniza trilhas/grupos AT&T do att_content.py no boot (sobrescreve routes).
  # Aplicado o catálogo de cursos Academy em 13-ago-2026 → DESLIGADO para não pisar
  # edições futuras feitas no /admin/trilhas. Religar só para reaplicar o att_content.
  - name: REFRESH_ATT_CONTENT
    value: "false"

  - name: CORS_ORIGINS
    value: "https://*.databricksapps.com,https://fevm-moi-ai.cloud.databricks.com"
